# toolbox/writes/delete_docs.yml -- delete docs on a target node by explicit ids or by id prefix + count.
#
# Inputs (provide EITHER ids OR id_prefix+count):  target, db_name (required);
#          ids (JSON list of doc ids), id_prefix (builds ids <id_prefix>/0..count-1),
#          count (required when id_prefix is set).
#
# Example: ansible-playbook toolbox/writes/delete_docs.yml -e target=1a -e db_name=Tenants -e id_prefix=micro/doc -e count=50

- name: Delete docs on a target node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: delete
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        ids: "{{ ids | default(omit) }}"
        id_prefix: "{{ id_prefix | default(omit) }}"
        count: "{{ count | default(0) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
