# toolbox/control/pause_gate.yml -- print a section banner and optionally pause for ENTER before continuing.
#
# Inputs:  section_label (required; shown in banner/prompt); pause_between_sections (default false; true to pause).
#
# Example: import_playbook ../../../toolbox/control/pause_gate.yml with vars: { section_label: "SECTION 5" }

- name: ">>> {{ section_label | default('next section') }} <<<"
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: ">>> Section banner"
      ansible.builtin.debug:
        msg:
          - "================================================================================"
          - ">>>>>  {{ section_label | default('next section') }}"
          - "================================================================================"

    - name: Pause before {{ section_label | default('next section') }}
      ansible.builtin.pause:
        prompt: >-
          About to start {{ section_label | default('next section') }}.
          Press ENTER to continue, Ctrl-C then 'A' to abort.
      when: pause_between_sections | default(false) | bool
