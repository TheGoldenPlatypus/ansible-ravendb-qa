# toolbox/network/clear_egress_delay.yml -- remove the netem qdisc installed by inject_egress_delay.yml.
#
# Inputs:  target (required); interface (default "eth0").
#
# Example: ansible-playbook toolbox/network/clear_egress_delay.yml -K -e target=1a

- name: Clear egress delay
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - target is defined
        fail_msg: "Required: -e target=<container>"

    - name: docker exec -- tc qdisc del root (idempotent)
      ansible.builtin.command:
        cmd: docker exec {{ target }} tc qdisc del dev {{ interface | default('eth0') }} root
      register: out
      changed_when: out.rc == 0
      failed_when: out.rc not in [0, 2]

    - name: Done
      ansible.builtin.debug:
        msg: "EGRESS-DELAY-CLEAR  {{ target }}:{{ interface | default('eth0') }} (rc={{ out.rc }})"
