# toolbox/writes/write_docs.yml -- write N docs (ids <id_prefix>/0..N-1) to a target node's DB.
#
# Inputs:  target, db_name, count (required); id_prefix (default "micro/doc");
#          body_tag (optional -- adds a "tag" field to each doc body).
#
# Example: ansible-playbook toolbox/writes/write_docs.yml -e target=1a -e db_name=db1 -e count=50

- name: Write N docs to a target node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: docs
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        count: "{{ count | int }}"
        id_prefix: "{{ id_prefix | default(omit) }}"
        body_tag: "{{ body_tag | default(omit) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
