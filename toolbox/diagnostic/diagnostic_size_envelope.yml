# toolbox/diagnostic/diagnostic_size_envelope.yml -- capture or check SizeOnDisk per node.
# Captures a baseline when baseline_file is missing; otherwise compares and prints growth %.
#
# Inputs:  db_name, nodes, baseline_file (required, absolute path); max_growth_pct (optional,
#          default 300, per-node growth ceiling when asserting); assert_mode (optional, default false).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_size_envelope.yml \
#              -e db_name=db1 -e baseline_file=$PWD/captures/size-baseline.json \
#              -e '{"nodes":["1a","1b","1c"]}'

- name: Storage envelope -- capture-or-check
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: size_envelope
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        baseline_file: "{{ baseline_file }}"
        max_growth_pct: "{{ max_growth_pct | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
