# toolbox/wait/wait_for_conflicts_resolved.yml -- wait until /replication/conflicts reports
# zero conflicts on every node.
#
# Inputs:  db_name, nodes (required, JSON list); timeout_secs (optional, default 60);
#          poll_interval (optional, default 2).
#
# Example: ansible-playbook toolbox/wait/wait_for_conflicts_resolved.yml \
#              -e db_name=Tenants -e timeout_secs=90 -e '{"nodes":["1a","1b","1c"]}'

- name: Wait until /replication/conflicts is empty on every node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: conflicts_resolved
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        timeout: "{{ timeout_secs | default(60) | int }}"
        poll_interval: "{{ poll_interval | default(2) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
