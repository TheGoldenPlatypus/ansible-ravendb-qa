# toolbox/wait/wait_for_quiescence.yml -- wait until every node's DatabaseChangeVector
# (from /stats) is identical.
#
# Inputs:  db_name, nodes (required, JSON list of the cluster to converge); timeout_secs
#          (optional, default 180); poll_interval (optional, default 2).
#
# Example: ansible-playbook toolbox/wait/wait_for_quiescence.yml \
#              -e db_name=Tenants -e '{"nodes":["1a","1b","1c"]}'

- name: Wait until every node's DatabaseChangeVector matches
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: quiescence
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        timeout: "{{ timeout_secs | default(180) | int }}"
        poll_interval: "{{ poll_interval | default(2) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
