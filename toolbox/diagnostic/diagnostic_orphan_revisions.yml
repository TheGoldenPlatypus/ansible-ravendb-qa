# toolbox/diagnostic/diagnostic_orphan_revisions.yml -- run the adopt-orphaned-revisions
# operation on every node and report AdoptedCount per node.
#
# Inputs:  db_name, nodes (required); budget_secs (optional, default 60, per-node budget);
#          assert_mode (optional, default false).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_orphan_revisions.yml \
#              -e db_name=db1 -e '{"nodes":["1a","1b","1c"]}'

- name: Adopt orphan revisions on every node and report counts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: orphan_revisions
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        budget_secs: "{{ budget_secs | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
