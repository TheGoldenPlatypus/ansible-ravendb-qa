# toolbox/wait/wait_for_marker_propagation.yml -- PUT a unique marker doc on source, then poll
# every target node until it appears.
#
# Inputs:  db_name, source (node to PUT on e.g. 1a), targets (JSON list of nodes to poll)
#          (required); timeout_secs (optional, default 60); marker_id_prefix (optional, default
#          "markers/").
#
# Example: ansible-playbook toolbox/wait/wait_for_marker_propagation.yml \
#              -e db_name=db1 -e source=1a -e '{"targets":["1b","1c"]}'

- name: Marker propagation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: marker_propagation
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        source: "{{ source }}"
        targets: "{{ targets }}"
        marker_id_prefix: "{{ marker_id_prefix | default(omit) }}"
        timeout: "{{ timeout_secs | default(60) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
