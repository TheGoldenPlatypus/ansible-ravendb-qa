# toolbox/wait/wait_for_stats_field_parity.yml -- poll /stats until the named count field(s)
# match across all nodes, or timeout.
#
# Inputs:  db_name, nodes (required, JSON list); fields (optional, JSON list of /stats fields,
#          default ["CountOfTombstones"]); timeout_secs (optional, default 180); poll_interval
#          (optional, default 3).
#
# Example: ansible-playbook toolbox/wait/wait_for_stats_field_parity.yml \
#              -e db_name=db1 -e '{"nodes":["1a","1b","1c"]}'

- name: Wait until specified /stats fields match across every node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: stats_field_parity
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        fields: "{{ fields | default(omit) }}"
        timeout: "{{ timeout_secs | default(180) | int }}"
        poll_interval: "{{ poll_interval | default(3) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
