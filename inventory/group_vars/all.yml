# target_mode is not set here. Pass -i inventory/ssh_hosts.yml to select ssh mode;
# without -i it defaults to docker.

clusters_count: 1
nodes_per_cluster: 3

docker_network_name: ravendb-qa
docker_image: docker.io/geerlingguy/docker-ubuntu2204-ansible:latest

ansible_python_interpreter: /usr/bin/python3

ravendb_domain: ravendb.test
rdb_version: 7.2.2

cert_dir: /home/certs
cert_server_pfx: "{{ cert_dir }}/server.pfx"
cert_ca_crt: "{{ cert_dir }}/ca.crt"
cert_ca_key: "{{ cert_dir }}/ca.key"
cert_client_pfx: "{{ cert_dir }}/client.pfx"
cert_license: "{{ cert_dir }}/license.json"
