# toolbox/diagnostic/diagnostic_replication_health.yml -- assert no replication ongoing task on
# target/db_name is faulted, errored, or reconnecting.
#
# Inputs:  target (node to query), db_name (required); assert_mode (optional, default false;
#          true fails the play on a stuck task).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_replication_health.yml \
#              -e target=1a -e db_name=db1 -e assert_mode=true

- name: Assert no stuck replication-flavored ongoing task on a target node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: replication_health
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        assert_mode: "{{ assert_mode | default(false) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
