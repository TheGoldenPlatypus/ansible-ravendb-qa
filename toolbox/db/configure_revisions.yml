# toolbox/db/configure_revisions.yml -- configure document revisions on a DB (simple or per-collection).
#
# Inputs:  target, db_name (required); minimum_revisions (simple mode, default 100),
#          collections_config (per-collection mode, dict { CollectionName: { keep:N, max_age_secs:S } }),
#          default_keep (default 25), default_max_age_secs (default 21600).
#
# Example: ansible-playbook toolbox/db/configure_revisions.yml -K -e target=1a -e db_name=Tenants

- name: Configure revisions on a DB
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Configure revisions ({{ target }}/{{ db_name }})
      ravendb_revisions:
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        minimum_revisions: "{{ minimum_revisions | default(100) | int }}"
        collections_config: "{{ collections_config | default(omit) }}"
        default_keep: "{{ default_keep | default(25) | int }}"
        default_max_age_secs: "{{ default_max_age_secs | default(21600) | int }}"
      register: result

    - name: Done
      ansible.builtin.debug:
        msg: "{{ result.msg }}"
