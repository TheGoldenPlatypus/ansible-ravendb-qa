# toolbox/service/hard_kill_ravendb.yml -- SIGKILL the Raven.Server process inside a container.
#
# Inputs:  target (required; container name).
#
# Example: ansible-playbook toolbox/service/hard_kill_ravendb.yml -K -e target=1a

- name: SIGKILL Raven.Server inside container
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - target is defined
        fail_msg: "Required: -e target=<container>"

    - name: docker exec -- pkill -9 Raven.Server
      ansible.builtin.command:
        cmd: docker exec {{ target }} pkill -9 -f "[R]aven.Server"
      register: out
      changed_when: out.rc == 0
      failed_when: out.rc not in [0, 1]

    - name: Done
      ansible.builtin.debug:
        msg: "HARD-KILL  {{ target }} Raven.Server SIGKILLed (rc={{ out.rc }}). systemd will respawn it; pair with wait_for_member if you need to gate on rejoin."
