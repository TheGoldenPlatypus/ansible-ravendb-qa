- name: Tear down all containers on hubsinknet
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Inspect the shared docker network
      community.docker.docker_network_info:
        name: "{{ docker_network_name }}"
      register: network_info

    - name: Collect the names of every container attached to the network
      ansible.builtin.set_fact:
        container_names: "{{ (network_info.network.Containers | default({})).values() | list | map(attribute='Name') | list }}"
      when: network_info.network is not none

    - name: Remove each container
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop: "{{ container_names | default([]) }}"

    - name: Remove the shared docker network
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        state: absent

    - name: Find containers still referencing this run's backups volume
      ansible.builtin.command:
        cmd: >-
          docker ps -a --filter "volume={{ backups_volume_name | default('lab_backups') }}"
          --format "{{ '{{' }}.ID{{ '}}' }}"
      register: _vol_refs
      changed_when: false
      failed_when: false

    - name: Force-remove any container still attached to the backups volume
      ansible.builtin.command:
        cmd: "docker rm -f {{ item }}"
      loop: "{{ _vol_refs.stdout_lines | default([]) }}"
      when: _vol_refs.stdout_lines | default([]) | length > 0
      changed_when: false
      failed_when: false

    - name: Remove the shared backups volume (with retry for in-use races)
      community.docker.docker_volume:
        name: "{{ backups_volume_name | default('lab_backups') }}"
        state: absent
      register: _vol_rm
      retries: 6
      delay: 5
      until: _vol_rm is succeeded

    - name: Wipe captures/ at repo root
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../captures"
        state: absent

    - name: Kill any leftover W-1 background workloads + their pidfiles
      ansible.builtin.shell: |
        pkill -f '[w]orkload_w1.sh' 2>/dev/null || true
        rm -f /tmp/w1-*.pid 2>/dev/null || true
        echo done
      changed_when: false


- name: Strip the hubsink hosts block from the controller's /etc/hosts
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  tasks:
    - name: Remove the ANSIBLE MANAGED CHAOS LAB block from /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED CHAOS LAB ({{ docker_network_name | default('default') }})"
        state: absent
