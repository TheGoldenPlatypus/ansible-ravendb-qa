# toolbox/writes/write_timeseries.yml -- append N timeseries entries to a doc, or delete a range from an existing timeseries.
#
# Inputs (append):  target, db_name, doc_id (required); ts_name (default "Heartrate"),
#                   count (default 100), start_timestamp (default now - 1h, ISO-8601 UTC),
#                   interval_seconds (default 6).
# Inputs (delete):  delete_from, delete_to (both required, ISO-8601 UTC; switches to delete mode).
#
# Example: ansible-playbook toolbox/writes/write_timeseries.yml -e target=1a -e db_name=Tenants -e doc_id=users/1 -e count=100

- name: Append timeseries entries or delete a range
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: timeseries
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        doc_id: "{{ doc_id }}"
        ts_name: "{{ ts_name | default(omit) }}"
        count: "{{ count | default(100) | int }}"
        start_timestamp: "{{ start_timestamp | default(omit) }}"
        interval_seconds: "{{ interval_seconds | default(6) | int }}"
        delete_from: "{{ delete_from | default(omit) }}"
        delete_to: "{{ delete_to | default(omit) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
