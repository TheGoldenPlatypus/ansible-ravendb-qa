# toolbox/workloads/wait_for_workload_started.yml -- block until a background workload's pidfile appears.
#
# Inputs:  pidfile (required; absolute path); timeout (default 30 seconds).
#
# Example: ansible-playbook toolbox/workloads/wait_for_workload_started.yml -e pidfile=/tmp/w1-1a-db1.pid

- name: Wait for a background workload's pidfile to appear
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - pidfile is defined
        fail_msg: "Required: -e pidfile=<absolute path>"

    - name: Wait for {{ pidfile }} to appear
      ansible.builtin.wait_for:
        path: "{{ pidfile }}"
        state: present
        timeout: "{{ timeout | default(30) | int }}"

    - name: Done
      ansible.builtin.debug:
        msg: "WORKLOAD STARTED  pidfile present at {{ pidfile }}"
