# toolbox/diagnostic/diagnostic_revision_count_parity.yml -- report per-id revision counts
# across nodes.
#
# Inputs:  db_name, nodes (required); provide either ids (optional) or id_prefix + count
#          (count required when id_prefix is set); expected_count (optional, assert exact count);
#          page_size (optional, default 1024); assert_mode (optional, default false).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_revision_count_parity.yml \
#              -e db_name=Tenants -e id_prefix=users/1 -e count=20 \
#              -e '{"nodes":["1a","1b","1c"]}'

- name: Per-id revision count parity across nodes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: revision_count_parity
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        ids: "{{ ids | default(omit) }}"
        id_prefix: "{{ id_prefix | default(omit) }}"
        count: "{{ count | default(omit) }}"
        expected_count: "{{ expected_count | default(omit) }}"
        page_size: "{{ page_size | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
