# toolbox/backup/restore_backup.yml -- restore a backup folder (present on the target's filesystem) as a new database, waiting for completion.
#
# Inputs:  target, backup_path (absolute path to the backup folder on target), new_db_name (required);
#          timeout_secs (default 600), poll_interval (default 3).
#
# Example: ansible-playbook toolbox/backup/restore_backup.yml -e target=1a -e backup_path=/backups/Tenants-20260528-180000 -e new_db_name=Tenants_restored

- name: Restore a backup as a new database and wait for completion
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve progress log path
      ansible.builtin.set_fact:
        progress_log: "/tmp/ravendb-restore-{{ new_db_name }}-{{ lookup('pipe','date +%Y%m%d-%H%M%S') }}.log"

    - name: Progress hint
      ansible.builtin.debug:
        msg:
          - "Long-running operation -- this task will block until the restore completes (or times out)."
          - "Watch progress live from another shell:   tail -F {{ progress_log }}"

    - ravendb_backup:
        kind: restore
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        backup_path: "{{ backup_path }}"
        new_db_name: "{{ new_db_name }}"
        timeout: "{{ timeout_secs | default(600) | int }}"
        poll_interval: "{{ poll_interval | default(3) | int }}"
        progress_log: "{{ progress_log }}"
      register: r

    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
