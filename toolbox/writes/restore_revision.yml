# toolbox/writes/restore_revision.yml -- restore an older revision of a single doc as the new live doc.
#
# Inputs:  target, db_name, doc_id, revision_cv (required; revision_cv is the change-vector
#          of the revision to restore).
#
# Example: ansible-playbook toolbox/writes/restore_revision.yml -e target=1a -e db_name=Tenants -e doc_id=files/1 -e revision_cv='A:3-uQvp4csQpESZNSbifH8hxQ'

- name: Restore an older revision as the live doc
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: restore_revision
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        doc_id: "{{ doc_id }}"
        revision_cv: "{{ revision_cv }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
