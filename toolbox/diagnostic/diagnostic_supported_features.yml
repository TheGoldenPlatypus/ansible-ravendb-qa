# toolbox/diagnostic/diagnostic_supported_features.yml -- print DatabaseRecord.SupportedFeatures
# for one db on one node.
#
# Inputs:  target (node to query), db_name (database whose record to read) (required).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_supported_features.yml \
#              -e target=1a -e db_name=db1

- name: Read DatabaseRecord.SupportedFeatures
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: supported_features
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        db_name: "{{ db_name }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
