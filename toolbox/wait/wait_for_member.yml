# toolbox/wait/wait_for_member.yml -- wait until a target node is a full Member of its database
# topology (in Members, not in Promotables or Rehabs).
#
# Inputs:  cluster_leader (any node to query e.g. 1a), db_name, target (node expected to become
#          Member e.g. 1b) (required); target_tag (optional, override the auto-derived cluster
#          tag); timeout_secs (optional, default 300).
#
# Example: ansible-playbook toolbox/wait/wait_for_member.yml \
#              -e cluster_leader=1a -e db_name=Tenants -e target=1b

- name: Wait until target rejoins as full Member
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: member
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        cluster_leader: "{{ cluster_leader }}"
        db_name: "{{ db_name }}"
        target: "{{ target }}"
        target_tag: "{{ target_tag | default(omit) }}"
        timeout: "{{ timeout_secs | default(300) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
