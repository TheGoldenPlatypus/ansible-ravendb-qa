# toolbox/writes/write_docs_freeform.yml -- write N freeform docs to a target node (random uuid id, "@collection": null).
#
# Inputs:  target, db_name, count (required).
#
# Example: ansible-playbook toolbox/writes/write_docs_freeform.yml -e target=2a -e db_name=Tenants -e count=1

- name: Write N freeform docs (random uuid ids, null collection)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: docs_freeform
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        count: "{{ count | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
