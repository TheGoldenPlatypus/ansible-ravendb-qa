# toolbox/wait/wait_for_leader.yml -- wait until /cluster/topology reports a non-empty Leader.
#
# Inputs:  target (required, any reachable node e.g. 1b); timeout_secs (optional, default 60);
#          expected_leader (optional, single-letter tag e.g. "B"; wait until Leader contains it,
#          otherwise any non-empty Leader passes).
#
# Example: ansible-playbook toolbox/wait/wait_for_leader.yml -e target=1b

- name: Wait until cluster reports a Leader
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: leader
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        expected_leader: "{{ expected_leader | default(omit) }}"
        timeout: "{{ timeout_secs | default(60) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
