# toolbox/writes/write_counters.yml -- increment a named counter on a doc (applies delta, repeat times).
#
# Inputs:  target, db_name, doc_id (required); counter_name (default "Likes"),
#          delta (default 1), repeat (default 1).
#
# Example: ansible-playbook toolbox/writes/write_counters.yml -e target=1a -e db_name=Tenants -e doc_id=users/1

- name: Increment a named counter on a doc
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: counters
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        doc_id: "{{ doc_id }}"
        counter_name: "{{ counter_name | default(omit) }}"
        delta: "{{ delta | default(1) | int }}"
        repeat: "{{ repeat | default(1) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
