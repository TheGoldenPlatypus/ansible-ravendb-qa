# toolbox/diagnostic/diagnostic_stats_parity.yml -- one /stats GET per node; print a table of
# 11 Count* fields plus SizeOnDisk.
#
# Inputs:  db_name, nodes (required); assert_fields (optional, subset of fields to assert on);
#          assert_mode (optional, default false).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_stats_parity.yml \
#              -e db_name=db1 -e '{"nodes":["1a","1b","1c"]}'

- name: /stats consolidated parity across nodes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: stats_parity
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        assert_fields: "{{ assert_fields | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
