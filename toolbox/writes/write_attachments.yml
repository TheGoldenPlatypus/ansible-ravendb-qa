# toolbox/writes/write_attachments.yml -- PUT N attachments onto existing docs (doc id <doc_id_prefix>/<n>, name <attachment_name>/<n>).
#
# Inputs:  target, db_name, count (required); doc_id_prefix (default "micro/doc"),
#          attachment_name (default "data"), payload (default "blob-<n>").
#
# Example: ansible-playbook toolbox/writes/write_attachments.yml -e target=1a -e db_name=Tenants -e count=10

- name: PUT N attachments on existing docs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: attachments
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        count: "{{ count | int }}"
        doc_id_prefix: "{{ doc_id_prefix | default(omit) }}"
        attachment_name: "{{ attachment_name | default(omit) }}"
        payload: "{{ payload | default(omit) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
