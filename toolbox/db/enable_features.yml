# toolbox/db/enable_features.yml -- POST a feature-flag change to /databases/<db>/admin/features and verify it in the DatabaseRecord.
#
# Inputs:  target (any node hosting the db, or the cluster leader), db_name (required);
#          add (JSON list of feature names to enable), remove (JSON list to disable);
#          at least one of add/remove must be non-empty.
#
# Example: ansible-playbook toolbox/db/enable_features.yml -K -e target=1a -e db_name=db1 -e '{"add":["SomeFeature"]}'

- name: Enable / disable database feature flags
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_features:
        kind: enable
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        add:    "{{ add    | default(omit) }}"
        remove: "{{ remove | default(omit) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
