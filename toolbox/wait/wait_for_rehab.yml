# toolbox/wait/wait_for_rehab.yml -- wait until a target node enters database-level rehab
# (appears in Rehabs or Promotables).
#
# Inputs:  cluster_leader (any node e.g. 1a), db_name, target (node expected to enter rehab
#          e.g. 1b) (required); target_tag (optional, override the auto-derived tag);
#          timeout_secs (optional, default 120).
#
# Example: ansible-playbook toolbox/wait/wait_for_rehab.yml \
#              -e cluster_leader=1a -e db_name=Tenants -e target=1b

- name: Wait until target enters rehab
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: rehab
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        cluster_leader: "{{ cluster_leader }}"
        db_name: "{{ db_name }}"
        target: "{{ target }}"
        target_tag: "{{ target_tag | default(omit) }}"
        timeout: "{{ timeout_secs | default(120) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
