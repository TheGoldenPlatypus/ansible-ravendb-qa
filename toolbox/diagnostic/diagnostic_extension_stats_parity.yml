# toolbox/diagnostic/diagnostic_extension_stats_parity.yml -- per-aspect /stats parity across
# nodes for:
#   attachments -> CountOfUniqueAttachments + CountOfAttachments
#   counters    -> CountOfCounterEntries
#   timeseries  -> CountOfTimeSeriesSegments
#
# Inputs:  db_name, nodes (required); aspects (optional, CSV subset of
#          attachments,counters,timeseries, default all three); assert_mode (optional, default false).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_extension_stats_parity.yml \
#              -e db_name=db1 -e '{"nodes":["9a","9b","9c"]}'

- name: Extension /stats parity across nodes (attachments / counters / time-series)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: extension_stats_parity
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        aspects: "{{ aspects | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
