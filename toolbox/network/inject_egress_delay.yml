# toolbox/network/inject_egress_delay.yml -- add fixed egress latency to a container's interface via tc netem.
#
# Inputs:  target, delay_ms (required); interface (default "eth0").
#
# Example: ansible-playbook toolbox/network/inject_egress_delay.yml -K -e target=1a -e delay_ms=2000

- name: Inject egress delay via tc netem
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - target is defined
          - delay_ms is defined
          - (delay_ms | int) > 0
        fail_msg: "Required: -e target=<container> -e delay_ms=<ms>"

    - name: docker exec -- tc qdisc replace netem delay
      ansible.builtin.command:
        cmd: docker exec {{ target }} tc qdisc replace dev {{ interface | default('eth0') }} root netem delay {{ delay_ms | int }}ms
      register: out
      changed_when: true

    - name: Done
      ansible.builtin.debug:
        msg: "EGRESS-DELAY  {{ target }}:{{ interface | default('eth0') }} = {{ delay_ms }}ms"
