# toolbox/writes/write_docs_interleaved.yml -- write N docs to a target node, round-robin through a list of id prefixes.
#
# Doc ids: for n in 0..count-1, <prefixes[n % len]>-<n // len>. With prefixes=["A","B"], count=4: A-0, B-0, A-1, B-1.
#
# Inputs:  target, db_name, count, prefixes (required; prefixes is a list of id prefixes).
#
# Example: ansible-playbook toolbox/writes/write_docs_interleaved.yml -e target=1a -e db_name=Tenants -e count=20 -e '{"prefixes":["tenants/cluster2/x","other/x"]}'

- name: Write N docs round-robin across prefixes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: docs_interleaved
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        count: "{{ count | int }}"
        prefixes: "{{ prefixes }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
