# toolbox/backup/backup_database.yml -- trigger an on-demand Logical or Snapshot backup and wait for completion.
#
# Inputs:  target, db_name (required); backup_type ("Backup" default, or "Snapshot"),
#          backup_path (default /backups/<db>-<timestamp>/), timeout_secs (default 300),
#          poll_interval (default 3).
#
# Example: ansible-playbook toolbox/backup/backup_database.yml -e target=1a -e db_name=Tenants

- name: Trigger an on-demand backup and wait for completion
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve progress log path
      ansible.builtin.set_fact:
        progress_log: "/tmp/ravendb-backup-{{ db_name }}-{{ lookup('pipe','date +%Y%m%d-%H%M%S') }}.log"

    - name: Progress hint
      ansible.builtin.debug:
        msg:
          - "Long-running operation -- this task will block until the backup completes (or times out)."
          - "Watch progress live from another shell:   tail -F {{ progress_log }}"

    - ravendb_backup:
        kind: backup
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        backup_type: "{{ backup_type | default(omit) }}"
        backup_path: "{{ backup_path | default(omit) }}"
        timeout: "{{ timeout_secs | default(300) | int }}"
        poll_interval: "{{ poll_interval | default(3) | int }}"
        progress_log: "{{ progress_log }}"
      register: r

    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
