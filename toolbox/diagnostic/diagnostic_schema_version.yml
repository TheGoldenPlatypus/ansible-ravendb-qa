# toolbox/diagnostic/diagnostic_schema_version.yml -- print FullVersion from /build/version per node.
#
# Inputs:  nodes (required, JSON list); require_parity (optional, default false, all nodes same
#          FullVersion); expected_version (optional, substring e.g. "6.2"); assert_mode (optional,
#          default false, required for require_parity / expected_version to fail).
#
# Example: ansible-playbook toolbox/diagnostic/diagnostic_schema_version.yml \
#              -e '{"nodes":["1a","1b","1c"]}'

- name: Read /build/version per node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_diagnostic:
        kind: schema_version
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        nodes: "{{ nodes }}"
        require_parity: "{{ require_parity | default(false) | bool }}"
        expected_version: "{{ expected_version | default(omit) }}"
        assert_mode: "{{ assert_mode | default(false) | bool }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
