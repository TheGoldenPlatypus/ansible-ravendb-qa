# toolbox/writes/write_docs_revisions.yml -- PUT count docs revs_per_doc times each, distinct body per PUT.
#
# Inputs:  target, db_name, count, revs_per_doc (required); id_prefix (default "seed"),
#          collection (default "MicroDocs").
#
# Example: ansible-playbook toolbox/writes/write_docs_revisions.yml -e target=1a -e db_name=db1 -e count=10000 -e revs_per_doc=5

- name: Write N docs x M distinct revisions each
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_writes:
        kind: docs_revisions
        target: "{{ target }}"
        db_name: "{{ db_name }}"
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        count: "{{ count | int }}"
        revs_per_doc: "{{ revs_per_doc | int }}"
        id_prefix: "{{ id_prefix | default(omit) }}"
        collection: "{{ collection | default(omit) }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
