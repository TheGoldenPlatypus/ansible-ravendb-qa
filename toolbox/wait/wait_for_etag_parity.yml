# toolbox/wait/wait_for_etag_parity.yml -- wait until each node's /stats LastDatabaseEtag is
# unchanged across two consecutive reads.
#
# Inputs:  db_name, nodes (required, JSON list); timeout_secs (optional, default 180);
#          poll_interval (optional, default 3).
#
# Example: ansible-playbook toolbox/wait/wait_for_etag_parity.yml \
#              -e db_name=db1 -e '{"nodes":["1a","1b","1c"]}'

- name: Wait until LastDatabaseEtag is stable on every node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ravendb_wait:
        kind: etag_parity
        ravendb_domain: "{{ ravendb_domain }}"
        client_cert: "{{ cert_dir }}/client.pem"
        ca_cert: "{{ cert_ca_crt }}"
        db_name: "{{ db_name }}"
        nodes: "{{ nodes }}"
        timeout: "{{ timeout_secs | default(180) | int }}"
        poll_interval: "{{ poll_interval | default(3) | int }}"
      register: r
    - ansible.builtin.debug: { msg: "{{ r.msg }}" }
